[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sayhi-project-intent"
version = "0.1.0"
description = "Independent scoped development-intent observatory"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
project-intent = "project_intent.cli:main"

[tool.setuptools.packages.find]
include = ["project_intent", "project_intent.*"]
namespaces = false

[tool.setuptools.package-data]
project_intent = ["web/*"]
