name: Project Intent checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Independent offline contract tests
        run: python3 -m unittest discover -s tests -v
      - name: Projection-only Workstream Map tests
        run: node --test tests/workstream-map.test.cjs tests/worker-groups.test.cjs tests/identity-facts.test.cjs
